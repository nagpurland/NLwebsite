name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nagpur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/nagpur_test
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/nagpur_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx drizzle-kit push --force
      - run: npm test
      - run: npm run build
      - run: npm start &
        env:
          PORT: 5000
      - run: timeout 30 sh -c 'until curl -sf http://localhost:5000 > /dev/null; do sleep 1; done'
      - run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5000
